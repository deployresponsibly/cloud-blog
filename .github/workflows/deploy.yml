name: Deploy

# Build on a GitHub-hosted runner, then deploy the finished artifact from the
# CodeBuild-hosted runner, the only job with AWS credentials. The CodeBuild
# webhook only accepts jobs from a workflow named exactly "Deploy".
on:
  push:
    branches: [main]
    paths-ignore:
      - 'infra/**'
      - '**.tf'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site
          path: dist
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: codebuild-cloud-blog-deploy-${{ github.run_id }}-${{ github.run_attempt }}
    env:
      AWS_REGION: us-east-1
      SITE_BUCKET: ${{ vars.SITE_BUCKET }}
      DISTRIBUTION_ID: ${{ vars.DISTRIBUTION_ID }}
    steps:
      # Lambda compute can only write under /tmp.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site
          path: /tmp/dist

      # Fingerprinted assets never change, so cache them for a year.
      - name: Sync assets
        run: |
          aws s3 sync /tmp/dist/_astro "s3://$SITE_BUCKET/_astro" \
            --delete --cache-control "public,max-age=31536000,immutable"

      # Everything else is revalidated on every request.
      - name: Sync pages
        run: |
          aws s3 sync /tmp/dist "s3://$SITE_BUCKET" \
            --delete --exclude "_astro/*" \
            --cache-control "public,max-age=0,must-revalidate"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION_ID" --paths '/*'
